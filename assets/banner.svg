<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06162B"/>
      <stop offset="0.6" stop-color="#0B2547"/>
      <stop offset="1" stop-color="#0A3B78"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0A66C2"/>
      <stop offset="1" stop-color="#5AB0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#2F8BFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2F8BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <rect width="1280" height="420" fill="url(#glow)"/>

  <!-- Left: title block -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="70" width="276" height="32" rx="16" fill="#0A66C2" fill-opacity="0.25" stroke="#5AB0FF" stroke-opacity="0.6"/>
    <circle cx="92" cy="86" r="5" fill="#4ADE80"/>
    <text x="106" y="91" font-size="14" font-weight="600" fill="#CFE6FF" letter-spacing="1.2">OPEN-SOURCE MCP SERVER</text>

    <text x="72" y="168" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">LinkedIn Ads Manager</text>
    <text x="72" y="232" font-size="58" font-weight="800" fill="#5AB0FF" letter-spacing="-1.5">for every AI client</text>

    <text x="72" y="280" font-size="20" font-weight="400" fill="#B9CCE4">Plan, launch, audit and report on LinkedIn campaigns</text>
    <text x="72" y="308" font-size="20" font-weight="400" fill="#B9CCE4">by chatting — with a safety gate on every dollar.</text>

    <!-- client pills -->
    <g font-size="15" font-weight="600" fill="#E6F1FF">
      <rect x="72" y="338" width="88" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="116" y="360" text-anchor="middle">Claude</text>
      <rect x="170" y="338" width="100" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="220" y="360" text-anchor="middle">ChatGPT</text>
      <rect x="280" y="338" width="92" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="326" y="360" text-anchor="middle">Gemini</text>
      <rect x="382" y="338" width="86" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="425" y="360" text-anchor="middle">Cursor</text>
    </g>
  </g>

  <!-- Right: dashboard card -->
  <g transform="translate(790 62)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="0" y="0" width="420" height="296" rx="18" fill="#0E2442" stroke="#5AB0FF" stroke-opacity="0.35"/>
    <rect x="0" y="0" width="420" height="44" rx="18" fill="#12305A"/>
    <rect x="0" y="26" width="420" height="18" fill="#12305A"/>
    <circle cx="22" cy="22" r="5" fill="#FF6B6B"/>
    <circle cx="40" cy="22" r="5" fill="#FFC857"/>
    <circle cx="58" cy="22" r="5" fill="#4ADE80"/>
    <text x="84" y="27" font-size="13" font-weight="600" fill="#CFE6FF">linkedin_get_campaign_analytics</text>

    <!-- KPI tiles -->
    <g font-size="11" font-weight="600" fill="#8FB0D6">
      <rect x="20" y="62" width="118" height="62" rx="10" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="32" y="82">SPEND</text>
      <text x="32" y="110" font-size="22" font-weight="800" fill="#FFFFFF">$4,820</text>
      <rect x="151" y="62" width="118" height="62" rx="10" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="163" y="82">CTR</text>
      <text x="163" y="110" font-size="22" font-weight="800" fill="#FFFFFF">0.84%</text>
      <rect x="282" y="62" width="118" height="62" rx="10" fill="#FFFFFF" fill-opacity="0.05"/>
      <text x="294" y="82">LEADS</text>
      <text x="294" y="110" font-size="22" font-weight="800" fill="#4ADE80">126</text>
    </g>

    <!-- bars -->
    <g>
      <line x1="20" y1="262" x2="400" y2="262" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <rect x="34"  y="214" width="30" height="48"  rx="5" fill="url(#bar)"/>
      <rect x="82"  y="196" width="30" height="66"  rx="5" fill="url(#bar)"/>
      <rect x="130" y="204" width="30" height="58"  rx="5" fill="url(#bar)"/>
      <rect x="178" y="176" width="30" height="86"  rx="5" fill="url(#bar)"/>
      <rect x="226" y="184" width="30" height="78"  rx="5" fill="url(#bar)"/>
      <rect x="274" y="160" width="30" height="102" rx="5" fill="url(#bar)"/>
      <rect x="322" y="146" width="30" height="116" rx="5" fill="url(#bar)"/>
      <polyline points="49,196 97,178 145,186 193,158 241,166 289,142 337,128" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <text x="20" y="284" font-size="11" fill="#8FB0D6">Preview → confirm=true → executed</text>
    <rect x="300" y="272" width="100" height="18" rx="9" fill="#4ADE80" fill-opacity="0.18"/>
    <text x="350" y="285" font-size="10.5" font-weight="700" fill="#4ADE80" text-anchor="middle">SAFETY GATE ON</text>
  </g>
</svg>
